[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modulo"
version = "0.1.0"
description = "Trust-weighted execution platform scaffold for Modulo v1."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Seth" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

